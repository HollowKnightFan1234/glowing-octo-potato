<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- LOGIN -->
        <div id="loginArea">

            <h1>🎮 Game Hub</h1>

            <h2>🔒 Log in</h2>

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button id="loginButton">Log in</button>

            <button id="signupButton">Create account</button>

            <button id="resendButton">
                Resend confirmation email
            </button>

            <p id="message"></p>

        </div>


        <!-- GAME HUB -->
        <div id="gameArea" style="display: none;">

            <header class="hubHeader">

                <h1>🎮 Game Hub</h1>

                <button id="logoutButton">
                    Log out
                </button>

            </header>


            <!-- NAVIGATION -->
            <nav class="hubNav">

                <button id="gamesTab">
                    🎮 Games
                </button>

                <button id="chatTab">
                    💬 Chat
                </button>

                <button id="accountTab">
                    👤 Account
                </button>

            </nav>


            <!-- GAMES -->
            <section id="gamesSection">

    <h2>🎮 Games</h2>

    <div id="gameGrid" class="gameGrid">

        <div class="gameCard">

            <h3>🕹️ Game 1</h3>

            <p>Our first game.</p>

            <button class="playButton" data-game="game1">
                Play
            </button>

        </div>


        <div class="gameCard">

            <h3>🚀 Game 2</h3>

            <p>Our second game.</p>

            <button class="playButton" data-game="game2">
                Play
            </button>

        </div>


        <div class="gameCard">

            <h3>🧩 Game 3</h3>

            <p>Another game can go here.</p>

            <button class="playButton" data-game="game3">
                Play
            </button>

        </div>

    </div>


    <!-- GAME PLAYER -->

    <div id="gamePlayer" style="display: none;">

        <button id="backToGamesButton">
            ← Back to games
        </button>

        <h2 id="currentGameTitle">
            Game
        </h2>

        <div id="gameContainer">

            <p>
                Game loading...
            </p>

        </div>

    </div>

</section>


            <!-- CHAT -->
            <section id="chatSection" style="display: none;">

                <h2>💬 Chat</h2>

                <div id="chatBox">

                    <p class="emptyChat">
                        No messages yet.
                    </p>

                </div>

                <div class="chatInputArea">

                    <input
                        type="text"
                        id="chatInput"
                        placeholder="Type a message..."
                        maxlength="500"
                    >

                    <button id="sendMessageButton">
                        Send
                    </button>

                </div>

            </section>


            <!-- ACCOUNT -->
            <section id="accountSection" style="display: none;">

                <h2>👤 Account</h2>

                <p id="accountEmail"></p>

            </section>

        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
